name: Collect and publish status
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']
permissions:
  contents: read
concurrency:
  group: status
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm test
      - name: Run checks
        run: node scripts/collect.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Keep history
        run: |
          git config user.name 'SpecWeave Status'
          git config user.email 'status@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -q -m 'Record status checks'
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
